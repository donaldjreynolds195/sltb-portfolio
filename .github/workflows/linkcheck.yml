name: Link audit

on:
  schedule:
    - cron: "17 13 1 * *"   # 1st of each month, ~9am Eastern
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    paths:
      - "linkcheck/**"
      - "tests/**"
      - "data/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  audit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Check every link in the saved inventory
        run: python -m linkcheck --inventory data/links-inventory.csv --out reports

      - name: Rebuild leadership drift report
        run: |
          python -m linkcheck.drift data/vol1-leadership.csv \
            --source-note "Book roster transcribed from SLTB Vol 1. Current roster last captured 2026-09-30; update data/vol1-leadership.csv to refresh."

      - name: Add results to the job summary
        run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Update link audit report [skip ci]"
          git push
